<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>寻味中山 · 中山美食汇</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
    }

    body {
        background: url("https://img0.baidu.com/it/u=3664322302,3240112030&fm=253&fmt=auto&app=138&f=JPEG?w=1920&h=1080") no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
    }

    .mask {
        background:
            linear-gradient(135deg, rgba(10, 25, 47, 0.55), rgba(60, 20, 20, 0.45)),
            linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.25));
        width: 100%;
        min-height: 100vh;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
    }

    .mask::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background:
            radial-gradient(circle at 20% 30%, rgba(255, 180, 80, 0.18), transparent 45%),
            radial-gradient(circle at 80% 70%, rgba(0, 180, 220, 0.15), transparent 50%);
        pointer-events: none;
    }

    header {
        text-align: center;
        color: #fff;
        margin-bottom: 40px;
        position: relative;
        z-index: 2;
        animation: fadeIn 1.2s ease;
    }

    header h1 {
        font-size: 44px;
        margin-bottom: 12px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        letter-spacing: 2px;
    }

    header p {
        font-size: 18px;
        opacity: 0.92;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .search-box {
        max-width: 640px;
        margin: 0 auto 40px;
        display: flex;
        gap: 10px;
        position: relative;
        z-index: 2;
        animation: fadeIn 1.4s ease;
    }

    #search-input {
        flex: 1;
        padding: 14px 20px;
        border-radius: 14px;
        border: none;
        font-size: 16px;
        outline: none;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        transition: 0.25s;
    }

    #search-input:focus {
        box-shadow: 0 0 0 4px rgba(200, 36, 35, 0.35);
    }

    #search-btn {
        padding: 14px 28px;
        background: linear-gradient(135deg, #c82423, #8b1414);
        color: #fff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 8px 24px rgba(200, 36, 35, 0.4);
        transition: 0.25s;
    }

    #search-btn:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #d93030, #a61c1c);
    }

    .result-card {
        max-width: 760px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.97);
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        display: none;
        position: relative;
        z-index: 2;
        animation: fadeIn 0.4s ease;
        overflow: hidden;
    }

    .result-card h2 {
        color: #c82423;
        margin-bottom: 10px;
        font-size: 26px;
    }

    .result-card .place {
        color: #666;
        margin-bottom: 18px;
        font-weight: 500;
    }

    .food-image {
        width: 100%;
        height: 260px;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 18px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        background: #eee;
    }

    .result-card p {
        line-height: 1.8;
        color: #333;
        font-size: 16px;
    }

    .tips {
        text-align: center;
        color: #fff;
        margin-top: 30px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        position: relative;
        z-index: 2;
        animation: fadeIn 1.6s ease;
    }

    .food-list {
        max-width: 760px;
        margin: 45px auto 0;
        background: rgba(255, 255, 255, 0.93);
        padding: 28px;
        border-radius: 20px;
        position: relative;
        z-index: 2;
        animation: fadeIn 1.8s ease;
    }

    .food-list h3 {
        color: #222;
        margin-bottom: 16px;
        font-size: 20px;
    }

    .food-list span {
        display: inline-block;
        background: #f3f4f6;
        color: #333;
        padding: 8px 16px;
        border-radius: 10px;
        margin: 6px;
        cursor: pointer;
        transition: 0.25s;
        border: 1px solid #e5e7eb;
    }

    .food-list span:hover {
        background: linear-gradient(135deg, #c82423, #8b1414);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(200, 36, 35, 0.35);
    }

    footer {
        text-align: center;
        color: #fff;
        margin-top: 60px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        font-size: 14px;
        position: relative;
        z-index: 2;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(14px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 32px;
        }
        .search-box {
            flex-direction: column;
        }
        #search-btn {
            width: 100%;
        }
        .food-image {
            height: 200px;
        }
    }
</style>
</head>

<body>
<div class="mask">
    <header>
        <h1>寻味中山 · 中山美食汇</h1>
        <p>搜索中山特色美食，查看美食故事、发源地与代表图片</p>
    </header>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="输入关键词，如：乳鸽、脆肉鲩、杏仁饼、腊味、濑粉" />
        <button id="search-btn">搜索中山美食</button>
    </div>

    <div class="result-card" id="result">
        <h2 id="food-name"></h2>
        <div class="place" id="food-place"></div>
        <img id="food-image" class="food-image" src="" alt="美食图片" style="display:none;" />
        <p id="food-desc"></p>
    </div>

    <div class="food-list">
        <h3>🔍 热门美食（点击快速查询）</h3>
        <span onclick="searchFood('石岐乳鸽')">石岐乳鸽</span>
        <span onclick="searchFood('中山杏仁饼')">中山杏仁饼</span>
        <span onclick="searchFood('东升脆肉鲩')">东升脆肉鲩</span>
        <span onclick="searchFood('芦兜粽')">芦兜粽</span>
        <span onclick="searchFood('三乡濑粉')">三乡濑粉</span>
        <span onclick="searchFood('沙溪扣肉')">沙溪扣肉</span>
        <span onclick="searchFood('黄圃腊味')">黄圃腊味</span>
    </div>

    <div class="tips">
        💡 提示：支持简称搜索，例如输入“乳鸽”可直接找到石岐乳鸽
    </div>

    <footer>
        © 2026 寻味中山 | 中山美食介绍网站
    </footer>
</div>

<script>
    const aliasMap = {
        "乳鸽": "石岐乳鸽",
        "红烧乳鸽": "石岐乳鸽",
        "石岐红烧乳鸽": "石岐乳鸽",
        "脆肉鲩": "东升脆肉鲩",
        "鲩鱼": "东升脆肉鲩",
        "杏仁饼": "中山杏仁饼",
        "腊味": "黄圃腊味",
        "腊肠": "黄圃腊味",
        "濑粉": "三乡濑粉",
        "扣肉": "沙溪扣肉",
        "粽子": "芦兜粽",
        "中山粽": "芦兜粽"
    };

    const foodData = {
        "石岐乳鸽": {
            place: "发源地：石岐街道",
            desc: "石岐乳鸽是中山最具代表性的招牌美食，选用20至28天的妙龄乳鸽制作。经典做法为红烧乳鸽，成品皮色红亮、皮脆肉嫩，咬开后肉汁丰盈，带有浓郁肉香，是游客到中山必尝的经典粤菜。",
            image: "https://img0.baidu.com/it/u=1841303307,2790102011&fm=253&fmt=auto&app=120&f=JPEG?w=800&h=600"
        },
        "中山杏仁饼": {
            place: "发源地：石岐",
            desc: "中山杏仁饼是中山经典传统糕点，始于清末民初。它以绿豆粉、杏仁、白砂糖等为主要原料，经过制粉、印花、烘焙等工序制成，饼身松化香脆，入口清甜不腻，是中山极具代表性的手信之一。",
            image: "https://img0.baidu.com/it/u=2269039044,1702112400&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500"
        },
        "东升脆肉鲩": {
            place: "发源地：东升",
            desc: "东升脆肉鲩是中山地理标志产品，产自中山东升一带。这种鲩鱼经过特定养殖方式培育，肉质紧实爽脆，久煮不易软烂，适合火锅、清蒸、炒鱼片等多种做法，口感独特，深受食客喜爱。",
            image: "https://img0.baidu.com/it/u=3802144041,110020140&fm=253&fmt=auto&app=120&f=JPEG?w=800&h=600"
        },
        "芦兜粽": {
            place: "发源地：南朗、火炬开发区一带",
            desc: "芦兜粽是中山传统粽类美食，以芦兜叶包裹糯米和馅料，粽体清香特别。常见馅料包括五花肉、咸蛋黄、红豆等，口感软糯，层次丰富，是中山人端午节和日常喜爱的地方风味。",
            image: "https://img0.baidu.com/it/u=120934141,3080013440&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=600"
        },
        "三乡濑粉": {
            place: "发源地：三乡镇",
            desc: "三乡濑粉是中山三乡镇的传统美食，距今已有两百多年历史。濑粉以优质粘米制成，粉条细长柔韧，搭配猪骨汤、烧腊、牛腩等食用，汤鲜味浓，是中山人早餐和正餐的经典选择。",
            image: "https://img0.baidu.com/it/u=3040010440,3211044004&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=500"
        },
        "沙溪扣肉": {
            place: "发源地：沙溪镇",
            desc: "沙溪扣肉是中山沙溪传统名菜，也是当地宴席“九大簋”中的代表菜。它选用五花肉搭配梅菜或咸菜蒸制，肉块肥而不腻，咸香入味，梅菜吸收肉汁后特别下饭，是极具乡土气息的中山味道。",
            image: "https://img0.baidu.com/it/u=1240030442,3300044004&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=600"
        },
        "黄圃腊味": {
            place: "发源地：黄圃镇",
            desc: "黄圃腊味是中山著名特产，也是国家地理标志产品。黄圃腊味以传统生晒工艺制作，包括腊肠、腊肉、腊鸭等，色泽红润，酒香与腊香浓郁，口感甘甜，可用于蒸饭、炒菜、煮面等多种吃法。",
            image: "https://img0.baidu.com/it/u=2000130442,1300044004&fm=253&fmt=auto&app=138&f=JPEG?w=800&h=600"
        }
    };

    const resultBox = document.getElementById("result");
    const nameDom = document.getElementById("food-name");
    const placeDom = document.getElementById("food-place");
    const imageDom = document.getElementById("food-image");
    const descDom = document.getElementById("food-desc");
    const input = document.getElementById("search-input");

    function searchFood(keyword) {
        let key = keyword.trim();
        if (aliasMap[key]) {
            key = aliasMap[key];
        }
        const food = foodData[key];
        if (food) {
            nameDom.innerText = key;
            placeDom.innerText = food.place;
            descDom.innerText = food.desc;
            imageDom.src = food.image;
            imageDom.alt = key + "实拍图";
            imageDom.style.display = "block";
            resultBox.style.display = "block";
        } else {
            nameDom.innerText = "未找到该美食";
            placeDom.innerText = "";
            descDom.innerText = "暂时没有收录这个美食，可以尝试搜索：乳鸽、脆肉鲩、杏仁饼、腊味、濑粉、扣肉。";
            imageDom.style.display = "none";
            resultBox.style.display = "block";
        }
    }

    document.getElementById("search-btn").addEventListener("click", function () {
        searchFood(input.value);
    });
    input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            searchFood(input.value);
        }
    });
</script>
</body>
</html>
